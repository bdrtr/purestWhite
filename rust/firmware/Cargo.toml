# The bare-metal firmware (esp-hal + Embassy), phase 2 of rust/README.md's plan. For now test
# images for the second OTA slot (src/bin/), the real firmware's main still to come. Its own
# workspace: it builds only for the ESP32-S3, the parent workspace's crates also for the host.
[workspace]

[package]
edition      = "2024"
name         = "purestwhite-firmware"
rust-version = "1.97"
version      = "0.1.0"
license      = "MIT"
publish      = false

[[bin]]
name = "purestwhite"
path = "./src/bin/purestwhite/main.rs"
test = false
bench = false

[[bin]]
name = "smoke-check"
path = "./src/bin/smoke_check.rs"
test = false
bench = false

[[bin]]
name = "display-check"
path = "./src/bin/display_check.rs"
test = false
bench = false

[[bin]]
name = "sd-check"
path = "./src/bin/sd_check.rs"
test = false
bench = false

[[bin]]
name = "button-check"
path = "./src/bin/button_check.rs"
test = false
bench = false

[[bin]]
name = "sleep-check"
path = "./src/bin/sleep_check.rs"
test = false
bench = false

[[bin]]
name = "psram-check"
path = "./src/bin/psram_check.rs"
test = false
bench = false

[[bin]]
name = "tasks-check"
path = "./src/bin/tasks_check.rs"
test = false
bench = false

[[bin]]
name = "input-check"
path = "./src/bin/input_check.rs"
test = false
bench = false

[[bin]]
name = "feedback-check"
path = "./src/bin/feedback_check/main.rs"
test = false
bench = false

[[bin]]
name = "scratch-check"
path = "./src/bin/scratch_check.rs"
test = false
bench = false

[[bin]]
name = "table-check"
path = "./src/bin/table_check.rs"
test = false
bench = false

[[bin]]
name = "write-check"
path = "./src/bin/write_check.rs"
test = false
bench = false

[[bin]]
name = "update-check"
path = "./src/bin/update_check.rs"
test = false
bench = false

[[bin]]
name = "install-check"
path = "./src/bin/install_check.rs"
test = false
bench = false

[[bin]]
name = "rollback-check"
path = "./src/bin/rollback_check.rs"
test = false
bench = false

[features]
# The PSRAM at 80 MHz without timing tuning, for a test image only (see src/board.rs).
psram-80mhz = []

[dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["embedded-storage", "esp32s3", "log-04"] }
esp-alloc = "=0.11.0"
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-println = { version = "=0.18.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "=0.10.0", features = ["log"] }
allocator-api2 = { version = "=0.3.1", default-features = false, features = ["alloc"] }
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
embassy-time = { version = "=0.5.1", features = ["log"] }
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-storage = "=0.3.2"
# esp-storage with interrupts masked around each ROM flash call (`critical-section`): a handler run
# from flash while the flash is busy would fetch garbage. esp-bootloader-esp-idf leaves it off (it
# takes esp-storage without default features).
esp-storage = { version = "=0.10.0", default-features = false, features = ["critical-section", "esp32s3"] }
nb = "=1.1.0"
log = "=0.4.34"
# The SD card: the card protocol over esp-hal's SDMMC slot (sdio, as esp-hal uses it); its FAT
# volume is our purestwhite-fat.
aligned = "=0.4.3"
block-device-driver = "=0.2.0"
sdio = "=0.5.3"

bembeyaz-font = { path = "../crates/bembeyaz-font" }
bembeyaz-gfx = { path = "../crates/bembeyaz-gfx" }
purestwhite-app = { path = "../crates/purestwhite-app" }
purestwhite-buttons = { path = "../crates/purestwhite-buttons" }
purestwhite-epd = { path = "../crates/purestwhite-epd" }
purestwhite-fat = { path = "../crates/purestwhite-fat" }
purestwhite-gauge = { path = "../crates/purestwhite-gauge" }
purestwhite-gt911 = { path = "../crates/purestwhite-gt911" }
purestwhite-ota = { path = "../crates/purestwhite-ota" }
purestwhite-render = { path = "../crates/purestwhite-render" }
purestwhite-rtc = { path = "../crates/purestwhite-rtc" }
purestwhite-services = { path = "../crates/purestwhite-services" }
purestwhite-touch = { path = "../crates/purestwhite-touch" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
