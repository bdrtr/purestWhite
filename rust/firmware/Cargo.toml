# The bare-metal firmware (esp-hal + Embassy), phase 2 of rust/README.md's plan. For now a smoke
# test for the second OTA slot: see src/bin/main.rs. Its own workspace: it builds only for the
# ESP32-S3, the parent workspace's crates also for the host.
[workspace]

[package]
edition      = "2024"
name         = "purestwhite-firmware"
rust-version = "1.97"
version      = "0.1.0"
license      = "MIT"
publish      = false

[[bin]]
name = "purestwhite-firmware"
path = "./src/bin/main.rs"
test = false
bench = false

[[bin]]
name = "rollback-check"
path = "./src/bin/rollback_check.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = "=0.11.0"
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-println = { version = "=0.18.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "=0.10.0", features = ["log"] }
embassy-time = { version = "=0.5.1", features = ["log"] }
embedded-hal = "=1.0.0"
log = "=0.4.34"

purestwhite-gauge = { path = "../crates/purestwhite-gauge" }
purestwhite-gt911 = { path = "../crates/purestwhite-gt911" }
purestwhite-rtc = { path = "../crates/purestwhite-rtc" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
