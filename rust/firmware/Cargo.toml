[[bin]]
name = "wifi-check"
path = "./src/bin/wifi_check.rs"
test = false
bench = false
required-features = ["wifi"]

[[bin]]
name = "wifi-join"
path = "./src/bin/wifi_join.rs"
test = false
bench = false
required-features = ["wifi"]

[[bin]]
name = "https-check"
path = "./src/bin/https_check.rs"
test = false
bench = false
required-features = ["wifi"]

[features]
# The PSRAM at 80 MHz without timing tuning, for a test image only (see src/board.rs).
psram-80mhz = []
# Wi-Fi through esp-radio, and HTTPS with wolfSSL (`crate::wifi`, `crate::clock`; wifi-check,
# wifi-join, https-check). A feature of its own: it links esp-radio's binary blobs, esp-rtos's
# scheduler hooks for the radio and wolfSSL into every image built with it, so the other images,
# the ones the emulator runs among them, are built without it.
wifi = [
    "dep:esp-radio",
    "dep:embassy-net",
    "dep:purestwhite-http",
    "dep:purestwhite-tls",
    "dep:purestwhite-wifistore",
    "esp-rtos/esp-radio",
]

[dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["embedded-storage", "esp32s3", "log-04"] }
esp-alloc = "=0.11.0"
# The release that matches esp-hal 1.2 and esp-rtos 0.4 (1.0.0-beta.2 was yanked).
esp-radio = { version = "=1.0.0-beta.1", optional = true, features = ["esp-alloc", "esp32s3", "log-04", "wifi"] }
# The network stack over esp-radio's interface: an address from DHCP (gate 2).
embassy-net = { version = "=0.9.1", optional = true, features = ["dhcpv4", "dns", "log", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-println = { version = "=0.18.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "=0.10.0", features = ["log"] }
allocator-api2 = { version = "=0.3.1", default-features = false, features = ["alloc"] }
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
embassy-time = { version = "=0.5.1", features = ["log"] }
embedded-hal = "=1.0.0"
embedded-hal-async = "=1.0.0"
embedded-storage = "=0.3.2"
# esp-storage with interrupts masked around each ROM flash call (`critical-section`): a handler run
# from flash while the flash is busy would fetch garbage. esp-bootloader-esp-idf leaves it off (it
# takes esp-storage without default features).
esp-storage = { version = "=0.10.0", default-features = false, features = ["critical-section", "esp32s3"] }
nb = "=1.1.0"
log = "=0.4.34"
# The SD card: the card protocol over esp-hal's SDMMC slot (sdio, as esp-hal uses it); its FAT
# volume is our purestwhite-fat.
aligned = "=0.4.3"
block-device-driver = "=0.2.0"
sdio = "=0.5.3"

bembeyaz-font = { path = "../crates/bembeyaz-font" }
bembeyaz-gfx = { path = "../crates/bembeyaz-gfx" }
purestwhite-app = { path = "../crates/purestwhite-app" }
purestwhite-buttons = { path = "../crates/purestwhite-buttons" }
purestwhite-epd = { path = "../crates/purestwhite-epd" }
purestwhite-fat = { path = "../crates/purestwhite-fat" }
purestwhite-gauge = { path = "../crates/purestwhite-gauge" }
purestwhite-gt911 = { path = "../crates/purestwhite-gt911" }
purestwhite-bootcount = { path = "../crates/purestwhite-bootcount" }
purestwhite-ota = { path = "../crates/purestwhite-ota" }
purestwhite-render = { path = "../crates/purestwhite-render" }
purestwhite-rtc = { path = "../crates/purestwhite-rtc" }
purestwhite-services = { path = "../crates/purestwhite-services" }
purestwhite-touch = { path = "../crates/purestwhite-touch" }
purestwhite-updater = { path = "../crates/purestwhite-updater" }
purestwhite-http = { path = "../crates/purestwhite-http", optional = true }
purestwhite-tls = { path = "../crates/purestwhite-tls", optional = true }
purestwhite-wifistore = { path = "../crates/purestwhite-wifistore", optional = true }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"

# esp-radio: "the radio blobs require optimization level 2 or 3", or Wi-Fi may fail to connect.
[profile.release.package.esp-radio]
opt-level = 3
