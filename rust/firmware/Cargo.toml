# The bare-metal firmware (esp-hal + Embassy), phase 2 of rust/README.md's plan. For now test
# images for the second OTA slot (src/bin/), the real firmware's main still to come. Its own
# workspace: it builds only for the ESP32-S3, the parent workspace's crates also for the host.
[workspace]

[package]
edition      = "2024"
name         = "purestwhite-firmware"
rust-version = "1.97"
version      = "0.1.0"
license      = "MIT"
publish      = false

[[bin]]
name = "purestwhite"
path = "./src/bin/purestwhite/main.rs"
test = false
bench = false

[[bin]]
name = "smoke-check"
path = "./src/bin/smoke_check.rs"
test = false
bench = false

[[bin]]
name = "display-check"
path = "./src/bin/display_check.rs"
test = false
bench = false

[[bin]]
name = "sd-check"
path = "./src/bin/sd_check.rs"
test = false
bench = false

[[bin]]
name = "button-check"
path = "./src/bin/button_check.rs"
test = false
bench = false

[[bin]]
name = "sleep-check"
path = "./src/bin/sleep_check.rs"
test = false
bench = false

[[bin]]
name = "psram-check"
path = "./src/bin/psram_check.rs"
test = false
bench = false

[[bin]]
name = "tasks-check"
path = "./src/bin/tasks_check.rs"
test = false
bench = false

[[bin]]
name = "input-check"
path = "./src/bin/input_check.rs"
test = false
bench = false

[[bin]]
name = "feedback-check"
path = "./src/bin/feedback_check/main.rs"
test = false
bench = false

[[bin]]
name = "scratch-check"
path = "./src/bin/scratch_check.rs"
test = false
bench = false

[[bin]]
name = "table-check"
path = "./src/bin/table_check.rs"
test = false
bench = false

[[bin]]
name = "write-check"
path = "./src/bin/write_check.rs"
test = false
bench = false

[[bin]]
name = "update-check"
path = "./src/bin/update_check.rs"
test = false
bench = false

[[bin]]
name = "install-check"
path = "./src/bin/install_check.rs"
test = false
bench = false

[[bin]]
name = "boot-check"
path = "./src/bin/boot_check.rs"
test = false
bench = false

[[bin]]
name = "count-check"
path = "./src/bin/count_check.rs"
test = false
bench = false

[[bin]]
name = "right-check"
path = "./src/bin/right_check.rs"
test = false
bench = false

[[bin]]
name = "rollback-check"
path = "./src/bin/rollback_check.rs"
test = false
