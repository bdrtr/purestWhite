[package]
name = "purestwhite-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads the card into a word-aligned buffer (the card's DMA wants it).
aligned = "=0.4.3"
bembeyaz-bmp = { path = "../bembeyaz-bmp" }
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
# Without a time driver: the firmware's comes from esp-rtos, the host's from `std` (below).
embassy-time = "=0.5.1"
purestwhite-app = { path = "../purestwhite-app" }
purestwhite-fat = { path = "../purestwhite-fat" }
purestwhite-render = { path = "../purestwhite-render" }

[dev-dependencies]
embassy-time = { version = "=0.5.1", features = ["std", "generic-queue-8"] }
# A card in memory, formatted by mkfs.fat.
purestwhite-fat = { path = "../purestwhite-fat", features = ["testing"] }
