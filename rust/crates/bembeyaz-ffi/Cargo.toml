bembeyaz-gfx = { path = "../bembeyaz-gfx" }
bembeyaz-html = { path = "../bembeyaz-html" }
bembeyaz-book = { path = "../bembeyaz-book" }
bembeyaz-clippings = { path = "../bembeyaz-clippings" }
bembeyaz-hyphenation = { path = "../bembeyaz-hyphenation" }
bembeyaz-image = { path = "../bembeyaz-image" }
bembeyaz-io = { path = "../bembeyaz-io" }
bembeyaz-jpeg = { path = "../bembeyaz-jpeg" }
bembeyaz-json = { path = "../bembeyaz-json" }
bembeyaz-kosync = { path = "../bembeyaz-kosync" }
bembeyaz-chapter = { path = "../bembeyaz-chapter" }
bembeyaz-layout = { path = "../bembeyaz-layout" }
bembeyaz-library = { path = "../bembeyaz-library" }
bembeyaz-opf = { path = "../bembeyaz-opf" }
bembeyaz-path = { path = "../bembeyaz-path" }
