[package]
name = "bembeyaz-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The single static library linked into the C++ firmware and host tests.
# Every Rust module is exported through here: two Rust staticlibs in one
# link would each carry their own copy of core/alloc.
[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
bembeyaz-bidi = { path = "../bembeyaz-bidi" }
bembeyaz-css = { path = "../bembeyaz-css" }
bembeyaz-hyphenation = { path = "../bembeyaz-hyphenation" }
bembeyaz-jpeg = { path = "../bembeyaz-jpeg" }
bembeyaz-layout = { path = "../bembeyaz-layout" }
bembeyaz-opf = { path = "../bembeyaz-opf" }
bembeyaz-path = { path = "../bembeyaz-path" }
bembeyaz-png = { path = "../bembeyaz-png" }
bembeyaz-utf8 = { path = "../bembeyaz-utf8" }
bembeyaz-xml = { path = "../bembeyaz-xml" }
bembeyaz-zip = { path = "../bembeyaz-zip" }
