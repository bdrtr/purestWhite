[package]
name = "bembeyaz-inflate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust port of miniz's tinfl. Only the core decoder is used: no
# allocation, no std. Pinned exactly: Inflater::init relies on its decoder
# state being valid when zeroed. After a bump, rerun the Miri test named in
# src/tests.rs (init_matches_new).
miniz_oxide = { version = "=0.9.1", default-features = false }

[dev-dependencies]
# Compresses reference data for the tests.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
