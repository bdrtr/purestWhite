[package]
name = "purestwhite-ota"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testing`: images built to order, SHA-256 from `sha2` and a NOR flash in memory, for the tests of
# the crates built on this one; never in the firmware.
testing = ["dep:sha2"]

[dependencies]
embedded-storage = "=0.3.2"
sha2 = { version = "=0.10.9", default-features = false, optional = true }

[dev-dependencies]
# The appended digest of the test images.
sha2 = { version = "=0.10.9", default-features = false }
