[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
# Keep symbols so firmware.elf stays addr2line-able; the flashed .bin has none.
debug = true

[profile.dev]
panic = "abort"

# Measured in the emulator: 2-4% faster JPEG decode for +2.3 KB flash. Generic functions
# (`decode`, `open` and the reads they make through the source) are built in bembeyaz-ffi, at "s".
[profile.release.package.bembeyaz-jpeg]
opt-level = 2
