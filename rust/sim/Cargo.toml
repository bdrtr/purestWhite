# The host simulator of the bare-metal firmware: the application, the renderer and the service
# loops on a PC, over a simulated board; see rust/firmware/DESIGN.md.
[package]
name = "purestwhite-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pw-sim"
path = "src/main.rs"

[dependencies]
embassy-futures = "=0.1.2"
embassy-sync = "=0.8.0"
# The time driver on the PC, for the panel loop's time limit.
embassy-time = { version = "=0.5.1", features = ["std", "generic-queue-8"] }
png = "=0.17.16"
purestwhite-app = { path = "../crates/purestwhite-app" }
# The card: an image in memory (`--card`), or one made by mkfs.fat in the tests.
purestwhite-fat = { path = "../crates/purestwhite-fat", features = ["testing"] }
purestwhite-render = { path = "../crates/purestwhite-render" }
purestwhite-services = { path = "../crates/purestwhite-services" }
